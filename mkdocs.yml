      - Constraints:
          - Overview: api/constraints/index.md
      - Metrics:
          - Distance: api/metrics/distance.md
          - Integration: api/metrics/alignment.md
          - Neighbourhood: api/metrics/neighbors.md
          - Reconstruction: api/metrics/reconstruction.md
      - Estimator:
          - Overview: api/estimator/index.md
          - VAE Estimator: api/estimator/vae_estimator.md
      - Commands:
          - Overview: api/commands/index.md
          - cbio: api/commands/cbio.md
      - BMEG: api/bmeg.md
      - Pathway: api/pathway.md
      - Latent Geometry: api/geometry.md
      - Analysis:
          - Hierarchy: api/analysis/hierarchy.md
          - Spatial: api/analysis/spatial.md
          - Matching: api/analysis/matching.md
          - Interpretability: api/analysis/interpret.md

theme: readthedocs

plugins:
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false

markdown_extensions:
    - mkdocs-click
